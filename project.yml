name: BlueiotMinimal
options:
  bundleIdPrefix: io.proximi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2ULWCJMDBJ
    CODE_SIGN_STYLE: Automatic

packages:
  # The Proximi.io iOS SDK as a customer consumes it: the published binary at an
  # exact version. `exactVersion:` rather than a range, because the map package
  # below pins the same identity and two different requirements on one identity
  # fail resolution. Bump both versions together.
  #
  # The binary is one flattened module behind two product names. `import Proximiio`
  # brings the whole SDK into scope, including the BlueIoT cloud-relay client this
  # app positions from.
  Proximiio:
    url: https://github.com/proximiio/proximiio-sdk-ios-binary
    exactVersion: "6.0.0-beta.43"
  # The venue map renderer, also a published binary. MapLibre arrives through this
  # package and must not be declared here: it is a SwiftPM binaryTarget, and two of
  # them in one graph fail resolution.
  ProximiioMap:
    url: https://github.com/proximiio/proximiio-map-ios-binary
    exactVersion: "6.0.0-beta.17"

targets:
  BlueiotMinimal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      # Sources and resources under the folder, including
      # BlueiotMinimal/Assets.xcassets, which xcodegen files as a resource.
      - path: BlueiotMinimal
    dependencies:
      - package: Proximiio
        product: Proximiio
      - package: ProximiioMap
        product: ProximiioMap
    info:
      path: BlueiotMinimal/Info.plist
      properties:
        CFBundleDisplayName: Venue Map
        # Without this key iOS letterboxes the app on iPad and Xcode warns. Style
        # the launch screen when branding the app.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad multitasking (App Store validation) requires all four orientations
        # unless UIRequiresFullScreen is set.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Build-time values from Config/App.xcconfig and the untracked
        # Config/Secrets.xcconfig, read at runtime by `VenueConfiguration`.
        # Empty when the secrets file is missing.
        ProximiioApplicationToken: $(PROXIMIIO_APPLICATION_TOKEN)
        BlueiotCloudRelayURL: $(BLUEIOT_CLOUD_RELAY_URL)
        BlueiotCloudRelayToken: $(BLUEIOT_CLOUD_RELAY_TOKEN)
        # A venue value, not a credential. Config/App.xcconfig carries this
        # venue's value in the tracked file.
        BlueiotGroundFloorNo: $(BLUEIOT_GROUND_FLOOR_NO)
        # `location` keeps the process running after the app leaves the screen.
        # The SDK sets `allowsBackgroundLocationUpdates`
        # (`relayOnly(token:runsInBackground:)`, see Venue.swift); iOS honours it
        # only with this mode declared. Without it the app is suspended 30 s after
        # backgrounding and the relay socket closes. This file is the source of
        # truth: BlueiotMinimal/Info.plist is generated and every
        # `xcodegen generate` rewrites it.
        UIBackgroundModes:
          - location
        # Location is the only permission the app requests (`LocationPrompt`), at
        # the "While Using the App" level. With the mode above that is enough to
        # keep running off screen, so the string describes the background use.
        # The other four are never requested: the venue positions the visitor
        # and the phone scans nothing. They are present because App Store
        # validation requires a string for every protected API the linked SDK
        # binary references. The SDK links ARKit for camera-assisted UWB
        # direction. Without the camera string, App Store upload fails with
        # ITMS-90683.
        NSLocationWhenInUseUsageDescription: Keeps your position updating while the app is in your pocket or the screen is locked, so the venue can go on placing you on the map. Your position comes from the venue's anchors, not from this phone.
        NSBluetoothAlwaysUsageDescription: Bluetooth is used by indoor positioning.
        NSMotionUsageDescription: Motion data smooths the position between updates.
        NSNearbyInteractionUsageDescription: Ultra-wideband ranging improves indoor positioning accuracy.
        NSCameraUsageDescription: The camera helps resolve the direction of nearby ultra-wideband anchors. This app does not use it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.proximi.BlueiotMinimal
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # The app icon is `AppIcon` in BlueiotMinimal/Assets.xcassets: one
        # 1024×1024 PNG. Xcode derives every size the App Store checks (120 px
        # iPhone, 152 px iPad, …) and writes `CFBundleIconName` into the built
        # Info.plist; validation fails on all three without a catalog. This is
        # xcodegen's default for an application target, stated explicitly to show
        # the dependency between the catalog and the setting.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BlueiotMinimalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BlueiotMinimalTests
    dependencies:
      - target: BlueiotMinimal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.proximi.BlueiotMinimalTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BlueiotMinimal:
    build:
      targets:
        BlueiotMinimal: all
        BlueiotMinimalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlueiotMinimalTests
    archive:
      config: Release
